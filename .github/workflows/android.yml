name: Android APK

on:
  push:
    branches: [main, ccr-00e8eb98-d03gy3]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Test, typecheck and integrity check
        run: |
          npm test
          npm run typecheck
          npm run check:integrity

      - name: Build web bundle and sync into the Android project
        run: npm run android:sync

      - name: Build signed APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: mv android/app/build/outputs/apk/release/app-release.apk "gold-signal-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: gold-signal-apk-${{ github.run_number }}
          path: gold-signal-*.apk
          retention-days: 30
